name: 'Validate Project'
description: 'Validate a project.yaml file against the CNCF .project schema'
inputs:
  project_file:
    description: >-
      Path to a single project.yaml to validate. Leave empty (recommended) to
      discover every project in the repository, which works for both
      single-project and multi-project layouts. Ignored when org.yaml exists.
    required: false
    default: ''
  output_format:
    description: 'Output format: text, json, yaml'
    required: false
    default: 'text'
  check_links:
    description: >-
      Check that every link in project.yaml resolves. A link that returns
      404/410 fails the run; placeholders (XXX, TODO) and links that cannot be
      confirmed (rate limits, bot blocking) are reported as warnings. On
      pull_request and push events only links that are new relative to the
      base branch (or the previous push) are checked, which requires a
      checkout with fetch-depth: 0.
    required: false
    default: 'false'
  token:
    description: 'GitHub token used for link checking (raises the API rate limit)'
    required: false
    default: ${{ github.token }}
runs:
  using: 'composite'
  steps:
    - name: Checkout automation tools
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      env:
        ACTION_REF: ${{ github.action_ref }}
      with:
        persist-credentials: false
        repository: cncf/automation
        ref: ${{ env.ACTION_REF }}
        path: _cncf-automation
        sparse-checkout: utilities/dot-project

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: _cncf-automation/utilities/dot-project/go.mod

    - name: Build validator
      shell: bash
      env:
        WORKSPACE: ${{ github.workspace }}
      run: |
        cd _cncf-automation/utilities/dot-project
        go build -o "${WORKSPACE}/_cncf-validator" ./cmd/validator

    - name: Validate project
      shell: bash
      env:
        WORKSPACE: ${{ github.workspace }}
        PROJECT_FILE: ${{ inputs.project_file }}
        OUTPUT_FORMAT: ${{ inputs.output_format }}
        CHECK_LINKS: ${{ inputs.check_links }}
        GITHUB_TOKEN: ${{ inputs.token }}
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        set -euo pipefail

        # A repository that declares org.yaml holds several projects, so a
        # single explicit path cannot describe it. Repos onboarded before
        # multi-project support still pass project_file: 'project.yaml';
        # honouring that literally would validate a root file that must not
        # exist in this layout, and would skip every real project.
        if [ -f org.yaml ] && [ -n "${PROJECT_FILE}" ]; then
          echo "::warning::org.yaml is present, so all projects in the repository are validated and the project_file input (${PROJECT_FILE}) is ignored. Remove that input from this workflow."
          PROJECT_FILE=""
        fi

        if [ -z "${PROJECT_FILE}" ]; then
          # Discovery resolves the layout from disk and validates the
          # repository structure as well as each project.
          ARGS=(-repo-root . -maintainers=)
        else
          cat > _project-list.yaml << PROJEOF
        projects:
          - url: "file://${WORKSPACE}/${PROJECT_FILE}"
            id: "project"
        PROJEOF
          ARGS=(-config _project-list.yaml -maintainers "")
        fi

        if [ "${CHECK_LINKS}" = "true" ]; then
          ARGS+=(-check-links)
          # On a pull request or push, links that already existed before it
          # are the scheduled scan's job; the change only answers for its own.
          # A push that creates a branch has an all-zero "before" SHA.
          if [ -n "${BASE_SHA}" ] && [ -n "${BASE_SHA//0/}" ]; then
            if git worktree add --detach "${RUNNER_TEMP}/_cncf-base" "${BASE_SHA}" > /dev/null 2>&1; then
              ARGS+=(-links-base "${RUNNER_TEMP}/_cncf-base")
            else
              echo "::notice::Base commit ${BASE_SHA} is not available (checkout with fetch-depth: 0); checking every link."
            fi
          fi
        fi

        "${WORKSPACE}/_cncf-validator" "${ARGS[@]}" -output "${OUTPUT_FORMAT}"

    - name: Cleanup
      shell: bash
      if: always()
      env:
        BASE_DIR: ${{ runner.temp }}/_cncf-base
      run: |
        if [ -d "${BASE_DIR}" ]; then git worktree remove --force "${BASE_DIR}" || true; fi
        rm -rf _cncf-automation _cncf-validator _project-list.yaml
