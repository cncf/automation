name: 'Update CNCF Landscape'
description: 'Updates the CNCF Landscape based on project metadata changes'
inputs:
  project_file:
    description: >-
      Path to a single project.yaml. Leave empty (recommended) to discover
      every project in the repository; each one gets its own branch and pull
      request. Ignored when org.yaml exists.
    required: false
    default: ''
  landscape_repo:
    description: 'Landscape repository (e.g., cncf/landscape)'
    required: false
    default: 'cncf/landscape'
  token:
    description: 'GitHub Token with permissions to create PRs on the landscape repo'
    required: true
runs:
  using: "composite"
  steps:
    - name: Checkout Automation Repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      env:
        ACTION_REF: ${{ github.action_ref }}
      with:
        persist-credentials: false
        repository: cncf/automation
        path: .cncf-automation-tool
        ref: ${{ env.ACTION_REF }}

    - name: Checkout Landscape Repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.landscape_repo }}
        path: .cncf-landscape
        token: ${{ inputs.token }}

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: .cncf-automation-tool/utilities/dot-project/go.mod

    - name: Build Updater
      shell: bash
      run: |
        cd .cncf-automation-tool/utilities/dot-project
        go build -o ../../../.cncf-landscape-updater ./cmd/landscape-updater

    - name: Configure Git Identity
      shell: bash
      run: |
        git -C .cncf-landscape config user.name "landscape-pr[bot]"
        git -C .cncf-landscape config user.email "projects@cncf.io"

    - name: Run Updater
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PROJECT_FILE: ${{ inputs.project_file }}
        LANDSCAPE_REPO: ${{ inputs.landscape_repo }}
      run: |
        set -euo pipefail

        # See validate-project: with org.yaml the repository holds several
        # projects, and each needs its own landscape pull request.
        if [ -f org.yaml ] && [ -n "${PROJECT_FILE}" ]; then
          echo "::warning::org.yaml is present, so the landscape is updated for every project in the repository and the project_file input (${PROJECT_FILE}) is ignored. Remove that input from this workflow."
          PROJECT_FILE=""
        fi

        if [ -z "${PROJECT_FILE}" ]; then
          SELECTOR=(--repo-root .)
        else
          SELECTOR=(--project "${PROJECT_FILE}")
        fi

        ./.cncf-landscape-updater \
          "${SELECTOR[@]}" \
          --landscape ".cncf-landscape/landscape.yml" \
          --landscape-repo "${LANDSCAPE_REPO}" \
          --create-pr
