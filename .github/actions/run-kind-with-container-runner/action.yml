# Deploys the AutoscalingRunnerSet via `helm install` of the official
# gha-runner-scale-set chart (not a hand-written manifest): this is the most
# reliable way to get the chart-version-matched labels the controller
# requires, matching how production manifests are generated.
name: 'Run kind with container runner'
description: >
  Start a kind cluster, install ARC, deploy an external-gha-runner
  container-mode AutoscalingRunnerSet scoped to this repo via the official
  gha-runner-scale-set Helm chart, and wait for the matching test-runner job
  to complete. Requires kind, kubectl, helm and docker on the runner (all
  preinstalled on ubuntu-latest).
inputs:
  base-image:
    description: 'Matrix leg being tested (resolute or noble); used for the scale-set name and job matching'
    required: true
  runner-image:
    description: 'Full image reference to deploy, e.g. ghcr.io/cncf/external-gha-runner-pr@sha256:...'
    required: true
  arc-github-token:
    description: 'GitHub PAT used by ARC to register runners against this repo'
    required: true
  github-token:
    description: 'Token used to poll job status and cancel the run (needs actions: write)'
    required: true
  pickup-timeout:
    description: 'Seconds to wait for the test-runner job to be picked up before cancelling the run'
    required: false
    default: '600'
runs:
  using: 'composite'
  steps:
    - name: Start kind cluster and deploy runner scale set
      shell: bash
      env:
        BASE_IMAGE: ${{ inputs.base-image }}
        RUNNER_IMAGE: ${{ inputs.runner-image }}
        ARC_GITHUB_TOKEN: ${{ inputs.arc-github-token }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}
      run: |
        set -euo pipefail

        SCALE_SET="runner-img-test-${GITHUB_RUN_ID}-${BASE_IMAGE}"

        kind create cluster

        kubectl wait --for=condition=Ready nodes --all --timeout=120s

        helm install cncf-gha-controller \
          --namespace arc-systems \
          --create-namespace \
          --version 0.14.1 \
          oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller

        kubectl wait --for=condition=Ready pod -l app.kubernetes.io/component=controller-manager --timeout=600s -n arc-systems

        kubectl create secret generic github-arc-secret --from-literal=github_token="${ARC_GITHUB_TOKEN}" -n arc-systems

        # Install (not kubectl apply a static manifest) so the
        # AutoscalingRunnerSet gets the chart-version-matched labels the
        # controller requires; see the top-of-file note on why.
        helm install "${SCALE_SET}" \
          oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
          --namespace arc-systems \
          --version 0.14.1 \
          --set githubConfigUrl="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
          --set githubConfigSecret=github-arc-secret \
          --set minRunners=0 \
          --set maxRunners=1 \
          --set containerMode.type=dind \
          --set controllerServiceAccount.name=cncf-gha-controller-gha-rs-controller \
          --set controllerServiceAccount.namespace=arc-systems \
          --set-string template.spec.containers[0].name=runner \
          --set-string template.spec.containers[0].image="${RUNNER_IMAGE}" \
          --set-string template.spec.containers[0].command[0]=/home/runner/run.sh

    - name: Wait for test-runner to complete
      shell: bash
      env:
        BASE_IMAGE: ${{ inputs.base-image }}
        GH_TOKEN: ${{ inputs.github-token }}
        PICKUP_TIMEOUT: ${{ inputs.pickup-timeout }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}
      run: |
        # matches the matrix job name (single dimension: base-image)
        TARGET_JOB="test-runner (${BASE_IMAGE})"
        START_TIME=$(date +%s)
        echo "Waiting for job: ${TARGET_JOB}"

        dump_arc_diagnostics() {
          echo "::group::pods"
          kubectl get pods -n arc-systems -o wide || true
          echo "::endgroup::"
          echo "::group::autoscalingrunnersets"
          kubectl get autoscalingrunnersets,ephemeralrunnersets,ephemeralrunners -n arc-systems -o wide || true
          echo "::endgroup::"
          echo "::group::controller-manager logs"
          kubectl logs -n arc-systems -l app.kubernetes.io/component=controller-manager --tail=300 || true
          echo "::endgroup::"
          echo "::group::listener logs"
          for pod in $(kubectl get pods -n arc-systems -l actions.github.com/scale-set-name --no-headers -o custom-columns=:metadata.name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n arc-systems "$pod" --all-containers --tail=300 || true
            kubectl describe pod -n arc-systems "$pod" || true
          done
          echo "::endgroup::"
        }

        while true; do
          if ! RESULT=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs); then
            echo "WARNING: gh api call failed, retrying..."
            sleep 30
            continue
          fi

          JOB_STATUS=$(echo "$RESULT" | jq -r --arg job "$TARGET_JOB" '.jobs[] | select(.name == $job) | .status')
          JOB_CONCLUSION=$(echo "$RESULT" | jq -r --arg job "$TARGET_JOB" '.jobs[] | select(.name == $job) | .conclusion')

          # GitHub's timeout-minutes only starts once a runner picks the job up,
          # so guard the queued phase separately.
          if [ "$JOB_STATUS" != "in_progress" ] && [ "$JOB_STATUS" != "completed" ]; then
            ELAPSED=$(( $(date +%s) - START_TIME ))
            if [ "$ELAPSED" -ge "$PICKUP_TIMEOUT" ]; then
              echo "ERROR: ${TARGET_JOB} was not picked up by a runner within $(( PICKUP_TIMEOUT / 60 )) minutes"
              dump_arc_diagnostics
              # A queued job's timeout-minutes never starts, so cancel the run
              # to avoid the test-runner job sitting queued for 24h.
              gh api -X POST repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel || true
              exit 1
            fi
          fi

          if [ -z "$JOB_STATUS" ]; then
            echo "Job '${TARGET_JOB}' not found yet, waiting..."
            sleep 30
            continue
          fi

          if [ "$JOB_STATUS" = "completed" ]; then
            if [ "$JOB_CONCLUSION" != "success" ]; then
              echo "ERROR: ${TARGET_JOB} failed"
              dump_arc_diagnostics
              exit 1
            fi
            echo "${TARGET_JOB} completed successfully"
            break
          fi

          echo "${TARGET_JOB} status: ${JOB_STATUS}, waiting..."
          sleep 30
        done

    - name: Dump ARC diagnostics (externally cancelled run)
      # Covers cancellation sources other than our own pickup-timeout branch
      # (e.g. a human cancelling the run), where diagnostics are captured
      # inline before we self-cancel via the GitHub API.
      if: ${{ cancelled() }}
      shell: bash
      run: |
        echo "::group::pods"
        kubectl get pods -n arc-systems -o wide || true
        echo "::endgroup::"
        echo "::group::autoscalingrunnersets"
        kubectl get autoscalingrunnersets,ephemeralrunnersets,ephemeralrunners -n arc-systems -o wide || true
        echo "::endgroup::"
        echo "::group::controller-manager logs"
        kubectl logs -n arc-systems -l app.kubernetes.io/component=controller-manager --tail=300 || true
        echo "::endgroup::"
        echo "::group::listener logs"
        for pod in $(kubectl get pods -n arc-systems -l actions.github.com/scale-set-name --no-headers -o custom-columns=:metadata.name 2>/dev/null); do
          echo "--- $pod ---"
          kubectl logs -n arc-systems "$pod" --all-containers --tail=300 || true
          kubectl describe pod -n arc-systems "$pod" || true
        done
        echo "::endgroup::"

    - name: Delete kind cluster
      if: ${{ always() }}
      shell: bash
      env:
        BASE_IMAGE: ${{ inputs.base-image }}
        GITHUB_RUN_ID: ${{ github.run_id }}
      run: |
        helm uninstall "runner-img-test-${GITHUB_RUN_ID}-${BASE_IMAGE}" -n arc-systems --timeout 120s || true
        kind delete cluster || true
