version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directories:
      - "/ci/cloudrunners"
      - "/ci/gha-runner-vm"
      - "/ci/gha-runner-vm-oci"
      - "/utilities/dot-project"
      - "/utilities/labeler"
      - "/utilities/landscape-mcp-server"
      - "/utilities/landscape-sync"
    schedule:
      interval: "weekly"
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directories:
      - "/ci/cloudrunners"
      - "/ci/cloudrunners/gcp"
      - "/ci/gha-runner-image"
      - "/utilities/dot-project"
      - "/utilities/labeler"
      - "/utilities/landscape-mcp-server"
    schedule:
      interval: "weekly"
    groups:
      docker-base-images:
        patterns:
          - "*"

  - package-ecosystem: "terraform"
    directories:
      - "/ci/iac/*/*"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directories:
      - "/Ambassadors"
      - "/Kubestronaut"
      - "/Kubestronaut/Rendering"
      - "/Kubestronaut/kubestronauts-coupons"
      - "/utilities/audit_project_lifecycle_across_tools"
    schedule:
      interval: "weekly"
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
