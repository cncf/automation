---
name: Build GitHub Runner Images

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    branches: [main]
    paths: ['ci/gha-runner-image/Dockerfile*', '.github/actions/run-kind-with-arc/**']
  # pull_request_target (not pull_request) so fork PRs get the secrets needed
  # to deploy a real ARC runner for testing; the authorize job below gates
  # fork PRs behind a manual environment approval before any of their code
  # runs with those secrets.
  pull_request_target:
    branches: [main]
    paths: ['ci/gha-runner-image/Dockerfile*', '.github/actions/run-kind-with-arc/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # PR builds (approved fork code) go to a separate package so their mutable
  # scratch tags never land in the production image.
  IMAGE_NAME: ${{ github.event_name == 'pull_request_target' && 'cncf/external-gha-runner-pr' || 'cncf/external-gha-runner' }}

jobs:
  # Fork PRs run with secrets under pull_request_target, so require a manual
  # review via the protected environment before anything else runs. Same-repo
  # PRs, pushes and dispatches pass through the unprotected environment.
  authorize:
    if: github.repository == 'cncf/automation'
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'runner-images-tests-fork' || 'runner-images-tests' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "authorized"

  build-runner-images:
    needs: authorize
    strategy:
      matrix:
        base-image: [resolute, noble]
    # Job outputs are shared across matrix legs (last writer wins), so each leg
    # must write to its own key. Legs leave the other keys empty, and empty
    # values do not overwrite values set by another leg.
    outputs:
      image-resolute: ${{ steps.image.outputs.image-resolute }}
      digest-resolute: ${{ steps.image.outputs.digest-resolute }}
      image-noble: ${{ steps.image.outputs.image-noble }}
      digest-noble: ${{ steps.image.outputs.digest-noble }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # pull_request_target defaults to the base branch; test the PR code.
          # Safe to opt in: fork runs are gated by the runner-images-tests-fork
          # environment approval in the authorize job.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          allow-unsafe-pr-checkout: true

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request_target'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Login against a Docker registry (PR builds push to the scratch
      # package too, so the image can be deployed to a real ARC runner below)
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # under pull_request_target github.sha is the BASE branch; tag with the PR head SHA instead
          DOCKER_METADATA_PR_HEAD_SHA: true
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event_name == 'pull_request_target' && format('pr-{0}-{1}', github.event.pull_request.number, matrix.base-image) || matrix.base-image }}

      # Build and push Docker image with Buildx. On PRs we also build a
      # single-platform image and load it into the local Docker daemon, so it
      # can be smoke-tested below. buildx cannot `load` a multi-platform
      # image, so the platform list is narrowed for PRs.
      # https://github.com/docker/build-push-action
      - name: Build and push ${{ matrix.base-image }} Docker image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./ci/gha-runner-image/
          platforms: ${{ github.event_name == 'pull_request_target' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: true
          load: ${{ github.event_name == 'pull_request_target' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          file: ./ci/gha-runner-image/Dockerfile
          build-args: |
            BASE_IMAGE=${{ matrix.base-image }}

      # PR-only fast sanity check of the locally loaded image: container
      # starts, runner scripts and tools are present, base image codename
      # matches the matrix leg. This is a cheap first gate that fails in
      # under a minute; it does NOT register an ephemeral runner against
      # GitHub (see the run-kind-with-arc/test-runner jobs
      # below for the real end-to-end check).
      - name: Smoke test ${{ matrix.base-image }} image
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tags }}
          EXPECTED_CODENAME: ${{ matrix.base-image }}
        run: |
          set -euo pipefail

          CONTAINER_NAME="smoke-${EXPECTED_CODENAME}"
          cleanup() { docker rm -f "${CONTAINER_NAME}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          echo "::group::Starting container from ${IMAGE_TAG}"
          docker run -d --name "${CONTAINER_NAME}" "${IMAGE_TAG}" sleep 300
          echo "::endgroup::"

          echo "::group::Checking runner scripts"
          for script in run.sh config.sh; do
            docker exec "${CONTAINER_NAME}" test -f "/home/runner/${script}" \
              || { echo "::error::${script} is missing from /home/runner"; exit 1; }
            docker exec "${CONTAINER_NAME}" test -x "/home/runner/${script}" \
              || { echo "::error::${script} is not executable"; exit 1; }
          done
          echo "::endgroup::"

          echo "::group::Checking required tools"
          for tool in git docker; do
            docker exec "${CONTAINER_NAME}" which "${tool}" >/dev/null \
              || { echo "::error::required tool '${tool}' is missing"; exit 1; }
          done
          echo "::endgroup::"

          echo "::group::Checking base image codename"
          ACTUAL_CODENAME=$(docker exec "${CONTAINER_NAME}" sh -c '. /etc/os-release && echo "$VERSION_CODENAME"')
          if [ "${ACTUAL_CODENAME}" != "${EXPECTED_CODENAME}" ]; then
            echo "::error::expected codename '${EXPECTED_CODENAME}' but /etc/os-release reports '${ACTUAL_CODENAME}'"
            exit 1
          fi
          echo "::endgroup::"

          echo "Smoke test passed for ${EXPECTED_CODENAME}"

      # Uses the identity token to provision an ephemeral certificate
      # against the sigstore community Fulcio instance.
      - name: Sign the published ${{ matrix.base-image }} Docker image
        if: ${{ github.event_name != 'pull_request_target' }}
        run: cosign sign -y ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}

      - name: Output image
        id: image
        env:
          BASE_IMAGE: ${{ matrix.base-image }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          # NOTE: We need to use the image and digest (not a tag) in order to
          # make sure that the image we attest/deploy has not been modified.
          echo "image-${BASE_IMAGE}=${REGISTRY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "digest-${BASE_IMAGE}=${DIGEST}" >> "$GITHUB_OUTPUT"

      # Generates a copy/paste-ready reference doc for end users: how to
      # pick up this runner image in a workflow, plus its key specs. Runs for
      # every trigger so the summary is always current, including on PRs
      # where it previews what main will publish.
      - name: Generate ${{ matrix.base-image }} image documentation
        env:
          BASE_IMAGE: ${{ matrix.base-image }}
        run: |
          {
            echo "## external-gha-runner: ${BASE_IMAGE}"
            echo
            echo "Ubuntu base: \`${BASE_IMAGE}\` (see matrix base-image for the codename)"
            echo
            echo "### Using this runner in a workflow"
            echo '```yaml'
            echo "jobs:"
            echo "  build:"
            echo "    runs-on: <arc-scale-set-name>  # see below for scale sets backed by ${BASE_IMAGE}"
            echo '```'
            echo
            # Scale-set-name <-> base-image codename is an infra deploy-time
            # decision (ci/cluster manifests), not something this build job
            # controls, and it isn't 1:1: several scale sets across
            # providers/sizes can share one codename. Rather than hardcode a
            # name that can drift, discover the live mapping from the repo
            # itself so this stays accurate without upkeep.
            echo "### Scale sets currently backed by this image"
            echo
            echo 'Found by: `grep -rl "external-gha-runner:'"${BASE_IMAGE}"'" ci/cluster/ | xargs grep "scale-set-name:"`'
            echo
            # GPU scale sets (nvidia.com/gpu request in the manifest) are
            # allocated case-by-case per project rather than generally
            # available, so their names are withheld here — only counted.
            MATCH_FILES=$(grep -rl "external-gha-runner:${BASE_IMAGE}" ci/cluster/ 2>/dev/null)
            GENERAL_NAMES=""
            GPU_COUNT=0
            for f in ${MATCH_FILES}; do
              if grep -q "nvidia.com/gpu" "$f"; then
                GPU_COUNT=$((GPU_COUNT + 1))
              else
                NAME=$(grep -h "scale-set-name:" "$f" | awk '{print $2}')
                GENERAL_NAMES="${GENERAL_NAMES}${NAME}
            "
              fi
            done
            GENERAL_NAMES=$(echo "${GENERAL_NAMES}" | sort -u | sed '/^$/d')
            if [ -n "${GENERAL_NAMES}" ]; then
              echo '```'
              echo "${GENERAL_NAMES}"
              echo '```'
            else
              echo "_No generally-available scale set currently references \`${BASE_IMAGE}\` — ask a maintainer to roll one out, or check \`ci/cluster/\` for the latest._"
            fi
            if [ "${GPU_COUNT}" -gt 0 ]; then
              echo
              echo "_Also backs ${GPU_COUNT} GPU-backed scale set(s), allocated case-by-case per project — contact a maintainer for access._"
            fi
            echo
            echo "### Key specs"
            echo "| Tool | Version/source |"
            echo "|------|------|"
            grep -E '^ARG (RUNNER_VERSION|RUNNER_CONTAINER_HOOKS_VERSION|DOCKER_VERSION|BUILDX_VERSION)=' ci/gha-runner-image/Dockerfile \
              | sed -E 's/^ARG ([A-Z_]+)=(.*)$/| \1 | \2 |/'
            grep -E '^ENV KIND_VERSION=' ci/gha-runner-image/Dockerfile \
              | sed -E 's/^ENV ([A-Z_]+)=(.*)$/| \1 | \2 |/'
            echo "| go | 1.27.1 (pinned in Dockerfile) |"
            echo
            echo "Also preinstalled: git (git-core PPA), make, maven, jq, zip/unzip, python3-pip, kind, docker CLI + buildx (dockerd runs in a sidecar container)."
          } >> "$GITHUB_STEP_SUMMARY"

  # Test the published image end-to-end: ARC in kind spawns a real
  # container-mode runner from the image just built/pushed above, which then
  # picks up the test-runner job below. PR-only: pushes/dispatches aren't
  # gated on this (they still go through provenance/verify).
  run-kind-with-arc:
    if: ${{ github.event_name == 'pull_request_target' }}
    needs: [authorize, build-runner-images]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    # must cover the pickup-timeout wait plus the test-runner timeout
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - base-image: resolute
            image: ${{ needs.build-runner-images.outputs.image-resolute }}
            digest: ${{ needs.build-runner-images.outputs.digest-resolute }}
          - base-image: noble
            image: ${{ needs.build-runner-images.outputs.image-noble }}
            digest: ${{ needs.build-runner-images.outputs.digest-noble }}
    steps:
      # Deliberately checks out the trusted BASE ref, not the PR head: this
      # job passes secrets.GHA_PAT to the local composite action below, so
      # the action code (and the manifest file it sed-patches) must come
      # from trusted content, never from PR-controlled code. Under
      # pull_request_target the default (no ref override) already resolves
      # to the base branch, so no `ref:`/`allow-unsafe-pr-checkout` here.
      - name: Checkout trusted base repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run kind with ARC and wait for test-runner
        uses: ./.github/actions/run-kind-with-arc
        with:
          runner-type: container
          base-image: ${{ matrix.base-image }}
          manifest-file: ci/cluster/lke-gha-iad2/manifests/container-runners/cncf-c-ubuntu-2-8-x86.yaml
          runner-image: ${{ matrix.image }}@${{ matrix.digest }}
          arc-github-token: ${{ secrets.GHA_PAT }}
          github-token: ${{ github.token }}
          pickup-timeout: '600'

  test-runner:
    if: ${{ github.event_name == 'pull_request_target' }}
    needs: build-runner-images
    strategy:
      matrix:
        base-image: [resolute, noble]
    runs-on: runner-img-test-${{ github.run_id }}-${{ matrix.base-image }}
    timeout-minutes: 10
    steps:
      # No checkout: this job only verifies tools/codename baked into the
      # image and runs a hello-world container, so it needs no repo files.
      # Checking out PR-controlled code onto a self-hosted ARC runner would
      # add risk (untrusted code execution) without any benefit.
      - name: Verify base image and tools
        env:
          EXPECTED_CODENAME: ${{ matrix.base-image }}
        run: |
          set -euo pipefail

          uname -a
          . /etc/os-release
          echo "Detected codename: ${VERSION_CODENAME}"
          if [ "${VERSION_CODENAME}" != "${EXPECTED_CODENAME}" ]; then
            echo "::error::expected codename '${EXPECTED_CODENAME}' but /etc/os-release reports '${VERSION_CODENAME}'"
            exit 1
          fi

          which git
          which docker
          docker version

      - name: Run a real job via the docker-in-docker sidecar
        run: docker run --rm hello-world

  # Generate SLSA provenance for the image
  # Upload the provenance to ghcr.io
  provenance:
    if: ${{ github.event_name != 'pull_request_target' }}
    needs: [build-runner-images]
    strategy:
      matrix:
        include:
          - image: ${{ needs.build-runner-images.outputs.image-resolute }}
            digest: ${{ needs.build-runner-images.outputs.digest-resolute }}
          - image: ${{ needs.build-runner-images.outputs.image-noble }}
            digest: ${{ needs.build-runner-images.outputs.digest-noble }}
    permissions:
      id-token: write  # For signing.
      actions: read    # For reading workflow info.
      packages: write  # For uploading attestations.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ matrix.image }}
      digest: ${{ matrix.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  # Verify the created provenance attestation.
  verify:
    # NOTE: this name is used as the status check name and by protected
    # branches for required status checks. It should have a unique name among
    # other pre-submits.
    name: verify container provenance
    needs: [build-runner-images, provenance]
    strategy:
      matrix:
        include:
          - image: ${{ needs.build-runner-images.outputs.image-resolute }}
            digest: ${{ needs.build-runner-images.outputs.digest-resolute }}
          - image: ${{ needs.build-runner-images.outputs.image-noble }}
            digest: ${{ needs.build-runner-images.outputs.digest-noble }}
    permissions:
      packages: read  # For reading attestations.
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request_target' }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.2.3'
      - env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST: ${{ matrix.digest }}
        run: |
          cosign version
          cosign verify-attestation \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp="^https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@refs/tags/v[0-9]+.*$" \
            --type slsaprovenance "${IMAGE_NAME}@${IMAGE_DIGEST}"
      # TODO (github.com/slsa-framework/slsa-verifier/issues/92):
      #       Add step to verify using slsa-verifier
