---
name: Build CloudRunner Docker Images

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    branches: [main]
    paths:
      - 'ci/cloudrunners/Dockerfile*'
      - 'ci/cloudrunners/oci/**'
      - '.github/actions/run-kind-with-arc/**'
      - '.github/scripts/test_with_kind_cluster.sh'
  # pull_request_target (not pull_request) so fork PRs get the secrets needed
  # by the test jobs; the authorize job below gates fork PRs behind a manual
  # environment approval before any of their code runs with those secrets.
  pull_request_target:
    branches: [main]
    paths:
      - 'ci/cloudrunners/Dockerfile*'
      - 'ci/cloudrunners/oci/**'
      - '.github/actions/run-kind-with-arc/**'
      - '.github/scripts/test_with_kind_cluster.sh'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # PR builds (approved fork code) go to a separate package so their mutable
  # pr-N tags never land in the production image.
  IMAGE_NAME: ${{ github.event_name == 'pull_request_target' && 'cncf/gha-cloudrunner-pr' || 'cncf/gha-cloudrunner' }}

jobs:
  # Fork PRs run with secrets under pull_request_target, so require a manual
  # review via the protected environment before anything else runs. Same-repo
  # PRs, pushes and dispatches pass through the unprotected environment.
  authorize:
    if: github.repository == 'cncf/automation'
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'cloudrunner-tests-fork' || 'cloudrunner-tests' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "authorized"

  build-cloudrunner-images:
    needs: authorize
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build-and-push.outputs.digest }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # pull_request_target defaults to the base branch; test the PR code
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: ${{ !startsWith(github.event_name, 'pull_request') }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Login against a Docker registry
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # under pull_request_target github.sha is the BASE branch; tag with the PR head SHA instead
          DOCKER_METADATA_PR_HEAD_SHA: true
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=pr

      # Build and push Docker image with Buildx
      # https://github.com/docker/build-push-action
      - name: Build and push Cloudrunner Docker image
        id: build-and-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./ci/cloudrunners/
          platforms: linux/amd64
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          file: ./ci/cloudrunners/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}

      # Uses the identity token to provision an ephemeral certificate
      # against the sigstore community Fulcio instance.
      - name: Sign the published Cloudrunner Docker image
        if: ${{ !startsWith(github.event_name, 'pull_request') }}
        run: cosign sign -y ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}

      - name: Output image
        id: image
        run: echo "image=${REGISTRY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

  # Generate SLSA provenance for the image
  # Upload the provenance to ghcr.io
  provenance:
    if: ${{ !startsWith(github.event_name, 'pull_request') }}
    needs: [build-cloudrunner-images]
    permissions:
      id-token: write  # For signing.
      actions: read    # For reading workflow info.
      packages: write  # For uploading attestations.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.build-cloudrunner-images.outputs.image }}
      digest: ${{ needs.build-cloudrunner-images.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  # Verify the created provenance attestation.
  verify:
    # NOTE: this name is used as the status check name and by protected
    # branches for required status checks. It should have a unique name among
    # other pre-submits.
    name: verify container provenance
    needs: [build-cloudrunner-images, provenance]
    permissions:
      packages: read  # For reading attestations.
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event_name, 'pull_request') }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.2.3'
      - env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ needs.build-cloudrunner-images.outputs.image }}
          IMAGE_DIGEST: ${{ needs.build-cloudrunner-images.outputs.digest }}
        run: |
          cosign version
          cosign verify-attestation \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp="^https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@refs/tags/v[0-9]+.*$" \
            --type slsaprovenance "${{ env.IMAGE_NAME }}@${{env.IMAGE_DIGEST}}"
      # TODO (github.com/slsa-framework/slsa-verifier/issues/92):
      #       Add step to verify using slsa-verifier

  # Test the published image end-to-end: ARC in kind spawns an OCI VM runner
  # from it, which then picks up the test-runner job below.
  run-kind-with-arc:
    needs: build-cloudrunner-images
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    # must cover the 10 min queue wait plus the 15 min test-runner timeout
    timeout-minutes: 30
    strategy:
      matrix:
        arch: [x86, arm]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run kind with ARC and wait for test-runner
        uses: ./.github/actions/run-kind-with-arc
        with:
          arch: ${{ matrix.arch }}
          manifest-file: ci/cluster/oci/vm-runners/cncf-ubuntu-2-8-${{ matrix.arch }}.yaml
          runner-image: ${{ needs.build-cloudrunner-images.outputs.image }}@${{ needs.build-cloudrunner-images.outputs.digest }}
          oci-user: ${{ secrets.OCI_CLI_USER }}
          oci-tenancy: ${{ secrets.OCI_CLI_TENANCY }}
          oci-fingerprint: ${{ secrets.OCI_CLI_FINGERPRINT }}
          oci-region: ${{ secrets.OCI_CLI_REGION }}
          oci-key-content: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          arc-github-token: ${{ secrets.GHA_PAT }}
          github-token: ${{ github.token }}

  test-runner:
    strategy:
      matrix:
        arch: [x86, arm]
    runs-on: oci-ci-test-${{ github.run_id }}-${{ matrix.arch }}
    needs: build-cloudrunner-images
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run uname to verify architecture
        run: |
          uname -a
          lsb_release -a
          cat /proc/cpuinfo

      - name: Build a dummy Docker image
        run: |
          cat <<EOF > Dockerfile.dummy
          FROM public.ecr.aws/docker/library/alpine:3.22
          RUN echo "hello from ${{ matrix.arch }}" > /hello.txt
          CMD ["cat", "/hello.txt"]
          EOF
          docker build -f Dockerfile.dummy -t dummy-test:local .
          docker run --rm dummy-test:local

      - name: Run kind cluster
        run: ${{ github.workspace }}/.github/scripts/test_with_kind_cluster.sh
