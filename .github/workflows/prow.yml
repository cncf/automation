name: Prow

# Chat-ops via cncf/prow-github-actions: /kind, /area, /priority, /status,
# /triage, /lgtm, /approve, /hold, /retest, ... plus needs-* labels.
# Configuration lives in .github/prow.yaml. Docs:
# https://github.com/cncf/prow-github-actions/blob/main/docs/installing.md
#
# Rollout: while this runs alongside labeler.yml / slash-commands.yml both bots
# will act on the same events. Once this is confirmed working, those two
# workflows (and the label sync jobs driven by .github/labels.yaml) should be
# retired so there is one source of truth.

on:
  issues:
    types: [opened, reopened, labeled, unlabeled]
  issue_comment:
    types: [created]
  # pull_request_target, not pull_request: fork PRs need a write token to be
  # labeled. Safe because nothing here checks out or runs PR code; the reusable
  # workflow only checks out cncf/prow-github-actions itself.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  check_suite:
    types: [completed]
  # backstop for merges missed by the events above
  schedule:
    - cron: '0 * * * *'
  # label-sync: run once after installing, then whenever .github/prow.yaml changes
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/prow.yaml]

# the reusable workflow can use at most what is granted here
permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write
  actions: write

# One run per comment; per event+action for everything else.
# Never cancel a run that may be merging.
concurrency:
  group: prow-${{ github.event_name }}-${{ github.event.action }}-${{ github.event.comment.id || github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  prow:
    if: github.repository == 'cncf/automation' && github.event_name != 'workflow_dispatch' && github.event_name != 'push'
    uses: cncf/prow-github-actions/.github/workflows/prow.yml@582d83b8c37fd9a48f67d65d24fb1f37ce2030eb # v3.0.0
    with:
      merge-method: squash

  label-sync:
    if: github.repository == 'cncf/automation' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    uses: cncf/prow-github-actions/.github/workflows/prow.yml@582d83b8c37fd9a48f67d65d24fb1f37ce2030eb # v3.0.0
    with:
      jobs: label-sync
