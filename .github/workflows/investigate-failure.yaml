name: Investigate Failure

on:
  workflow_dispatch:
  push:
    branches:
      - tmp-koray

permissions:
  contents: read

jobs:
  test-runner:
    runs-on: cncf-ubuntu-16-64-x86
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          version: type=image,tag=29
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
          set-host: true

      - name: Verify Docker setup
        if: always()
        run: |
          ACTION_DIR=$(ls -1d /home/ubuntu/setup-docker-action/run-*)
          DOCKER=/opt/hostedtoolcache/docker-image/29/x64/docker
          SOCK="unix://$ACTION_DIR/docker.sock"

          id
          env | grep -i '^DOCKER' || true
          which -a docker || true
          ls -ld "$ACTION_DIR"
          ls -l "$ACTION_DIR/docker.sock" /var/run/docker.sock || true

          echo "--- as ubuntu ---"
          DOCKER_HOST="$SOCK" "$DOCKER" version || true

          echo "--- as root ---"
          sudo DOCKER_HOST="$SOCK" "$DOCKER" version || true
          sudo DOCKER_HOST="$SOCK" "$DOCKER" info || true