name: Investigate Failure

on:
  workflow_dispatch:
  push:
    branches:
      - tmp-koray

permissions:
  contents: read

jobs:
  test-runner:
    runs-on: cncf-ubuntu-16-64-x86
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          version: type=image,tag=29
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
          set-host: true

      - name: Verify Docker setup
        if: always()
        run: |
          ACTION_DIR=$(ls -1d /home/ubuntu/setup-docker-action/run-*)
          echo "ACTION_DIR: $ACTION_DIR"
          sleep 30
          echo "--- Starting Docker daemon verification ---"
          sudo /opt/hostedtoolcache/docker-image/29/x64/dockerd \
            --host="unix:///$ACTION_DIR/docker.sock" \
            --config-file="$ACTION_DIR/daemon.json" \
            --exec-root="$ACTION_DIR/execroot" \
            --data-root="$ACTION_DIR/data" \
            --pidfile="$ACTION_DIR/docker.pid"
          echo "--- Docker daemon started successfully ---"
          docker version
          docker info
