# Example CI workflow for syncing project.yaml changes to the CNCF Landscape
# Copy this to your project's .github/workflows/ directory
#
# Documentation: https://github.com/cncf/automation/tree/main/utilities/dot-project

name: Update Landscape
on:
  push:
    branches: [main]
    paths:
      - 'project.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Update Landscape
        uses: cncf/automation/.github/actions/landscape-update@53810a548b46f33421cd67e57d16e4b7251416d9
        with:
          project_file: 'project.yaml'
          token: ${{ secrets.LANDSCAPE_REPO_TOKEN }}
