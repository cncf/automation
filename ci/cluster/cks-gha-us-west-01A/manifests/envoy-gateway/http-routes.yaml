apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
  labels:
    use-shared-gateway: "true"
spec:
  hostnames:
  - cw.dashboard.cncf.io
  parentRefs:
  - name: shared-gateway
    namespace: envoy-gateway
  rules:
  - backendRefs:
    - name: kube-prometheus-stack-grafana
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /public-dashboards
