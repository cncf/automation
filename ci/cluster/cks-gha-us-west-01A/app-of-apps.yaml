apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    notifications.argoproj.io/subscribe.slack: internal-gha-argo
  name: app-of-apps
  namespace: argocd
  labels:
    cluster: cks-gha-us-west-01A
spec:
  project: default
  source:
    repoURL: https://github.com/cncf/automation
    targetRevision: HEAD
    path: ci/cluster/cks-gha-us-west-01A/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
    retry:
      limit: 1
      backoff:
        duration: 5s 
        factor: 2 
        maxDuration: 1m
