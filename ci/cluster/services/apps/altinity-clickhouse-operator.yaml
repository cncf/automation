apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clickhouse-altinity-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "25"
    notifications.argoproj.io/subscribe.slack: internal-gha-argo
  labels:
    cluster: oke-cncf-automation
spec:
  project: default
  source:
    repoURL: https://helm.altinity.com
    chart: altinity-clickhouse-operator
    targetRevision: 0.26.0
    helm:
      values: |
        crdHook:
          enabled: true
          image:
            repository: docker.io/bitnami/kubectl
        operator:
          image:
            registry: "docker.io"
        metrics:
          image:
            registry: "docker.io"
        fullnameOverride: clickhouse-altinity-operator
        serviceMonitor:
          enabled: true
        configs:
          files:
            config.yaml:
              watch:
                namespaces: ["clickhouse-altinity", "bomhort"]
          configdFiles:
            01-clickhouse-02-logger.xml: |
              <yandex>
                <logger>
                  <level>information</level>
                  <log>/var/log/clickhouse-server/clickhouse-server.log</log>
                  <errorlog>/var/log/clickhouse-server/clickhouse-server.err.log</errorlog>
                  <size>1000M</size>
                  <count>10</count>
                  <console>1</console>
                </logger>
              </yandex>
  destination:
    server: https://kubernetes.default.svc
    namespace: clickhouse-altinity
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      namespace: clickhouse-altinity
      jsonPointers:
        - /spec/template/spec/containers/0/env
        - /spec/template/spec/containers/1/env
