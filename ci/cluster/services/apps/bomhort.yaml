apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bomhort
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "25"
    notifications.argoproj.io/subscribe.slack: internal-gha-argo
  labels:
    cluster: oke-cncf-automation
spec:
  project: default
  source:
    repoURL: ghcr.io/seebom-labs/bomhort/charts
    chart: bomhort
    targetRevision: 0.7.1
    helm:
      values: |
        cleanBatchJobs: false
        clickhouse:
          database: bomhort
          host: chi-bomhort-clickhouse-bomhort-cluster-0-0
          installation:
            podTemplate:
              containerImage: docker.io/clickhouse/clickhouse-server:24.8
              resources:
                limits:
                  cpu: "4"
                  memory: 16Gi
                requests:
                  cpu: "2"
                  memory: 8Gi
            volumeClaimTemplate:
              dataStorage: 500Gi
              logStorage: 10Gi
          port: 9000
          user: default
          userPasswordSecret:
            enabled: true
            key: password
            secretName: clickhouse-password
        gitSync:
          enabled: false
        image:
          registry: ghcr.io
          repository: seebom-labs/bomhort
          tag: 0.7.1
        sbomSource:
          mountPath: /data/sboms
          pvcName: bomhort-sbom-data
          storageSize: 20Gi
        seedJob:
          sbomBranch: main
          sbomRepo: https://github.com/cncf/sbom.git
        licenseExceptions:
          # seedJob.cncfExceptionsURL was removed in 0.7.0: exceptions are no
          # longer downloaded at runtime, they are a reviewed ConfigMap.
          # 0.7.1 parses the cncf/foundation file as-is, so this can be filled
          # from license-exceptions/exceptions.json - see the PR discussion for
          # how to wire it up without inlining 180 KB here. Empty until then,
          # which matches the effective behaviour on 0.6.1 (the file never
          # parsed, so no approvals were ever in effect).
          enabled: true
          custom: |
            { "blanketExceptions": [], "exceptions": [] }
        originalStore:
          # Explicit: `auto` would resolve to s3 and write originals into the
          # first bucket below, which these credentials cannot write to.
          backend: none
        s3:
          buckets:
            - name: cncf-project-sboms
              endpoint: https://us-iad-18.linodeobjects.com
              region: us-iad-18
              usePathStyle: true
              tags: ["projects"]
              pathLayout: "project"
            - name: cncf-subproject-sboms
              endpoint: https://us-iad-18.linodeobjects.com
              region: us-iad-18
              usePathStyle: true
              tags: ["subprojects"]
              pathLayout: "namespace/project"
            - name: sandbox-reviews
              endpoint: https://us-iad-18.linodeobjects.com
              region: us-iad-18
              usePathStyle: true
              tags: ["sandbox-applications"]
              pathLayout: "_/_/project"
  destination:
    server: https://kubernetes.default.svc
    namespace: bomhort
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: batch
      kind: Job
      jqPathExpressions:
        - .status
        - .spec.selector
        - .spec.template.metadata.labels
