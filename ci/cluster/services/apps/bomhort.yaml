apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bomhort
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "25"
    notifications.argoproj.io/subscribe.slack: internal-gha-argo
  labels:
    cluster: oke-cncf-automation
spec:
  project: default
  sources:
    - repoURL: ghcr.io/seebom-labs/bomhort/charts
      chart: bomhort
      targetRevision: 0.8.0
      helm:
        values: |
          cleanBatchJobs: false
          clickhouse:
            database: bomhort
            host: chi-bomhort-clickhouse-bomhort-cluster-0-0
            installation:
              podTemplate:
                resources:
                  limits:
                    cpu: "4"
                    memory: 16Gi
                  requests:
                    cpu: "2"
                    memory: 8Gi
              volumeClaimTemplate:
                dataStorage: 500Gi
                logStorage: 10Gi
            port: 9000
            user: default
            userPasswordSecret:
              enabled: true
              key: password
              secretName: clickhouse-password
          apiGateway:
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi
          gitSync:
            enabled: false
          sbomSource:
            mountPath: /data/sboms
            pvcName: bomhort-sbom-data
            storageSize: 20Gi
          originalStore:
            # Explicit: `auto` would resolve to s3 and write originals into the
            # first bucket below, which these credentials cannot write to.
            backend: none
          s3:
            buckets:
              - name: cncf-project-sboms
                endpoint: https://us-iad-18.linodeobjects.com
                region: us-iad-18
                usePathStyle: true
                tags: ["projects"]
                pathLayout: "project"
              - name: cncf-subproject-sboms
                endpoint: https://us-iad-18.linodeobjects.com
                region: us-iad-18
                usePathStyle: true
                tags: ["subprojects"]
                pathLayout: "namespace/project"
              - name: sandbox-reviews
                endpoint: https://us-iad-18.linodeobjects.com
                region: us-iad-18
                usePathStyle: true
                tags: ["sandbox-applications"]
                pathLayout: "_/_/project"
          licenseExceptions:
            enabled: true
            source: https://exceptions.cncf.io/exceptions.json
          mcp:
            enabled: true
            transport: http
            allowedOrigins: ["https://bomhort.cncf.io"]
            existingSecret:
              enabled: true
              secretName: bomhort-mcp
              httpTokenKey: MCP_HTTP_TOKEN
  destination:
    server: https://kubernetes.default.svc
    namespace: bomhort
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: batch
      kind: Job
      jqPathExpressions:
        - .status
        - .spec.selector
        - .spec.template.metadata.labels
